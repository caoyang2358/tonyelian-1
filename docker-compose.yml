services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copper_twin
      POSTGRES_USER: copper_twin
      POSTGRES_PASSWORD: copper_twin_dev
    ports:
      - "5432:5432"
    volumes:
      - copper_twin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copper_twin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  copper_twin_pg:

