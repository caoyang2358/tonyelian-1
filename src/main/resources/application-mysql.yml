spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/copper_twin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:copper_twin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration-mysql
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai

