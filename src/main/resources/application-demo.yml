spring:
  datasource:
    url: jdbc:h2:mem:coppertwin_demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai

app:
  cors:
    allowed-origins: http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
